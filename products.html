<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — Emybakeditph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo"><img src="images/logo.png" alt="Emybakeditph"></a>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="products.html" class="active">Products</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
      <a href="cart.html" class="cart-link" aria-label="View cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.6 13.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span class="cart-badge" data-cart-count>0</span>
      </a>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<div class="breadcrumb">
  <div class="container"><a href="index.html">Home</a><span class="sep">/</span>Products</div>
</div>

<main>
  <section class="section">
    <div class="container products-layout">
      <aside class="category-sidebar">
        <h4>Categories</h4>
        <div id="categoryList"></div>
      </aside>

      <div>
        <p class="results-meta" id="resultsMeta"></p>
        <div class="product-grid cols-3" id="productGrid"></div>
        <p class="empty-state" id="emptyState" hidden>No pastries found in this category yet.</p>
        <div class="pagination" id="pagination"></div>
      </div>
    </div>
  </section>
</main>

<footer class="value-strip">
  <div class="container">
    <span class="value-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v6M12 2c-3 2-5 5-5 9a5 5 0 0 0 10 0c0-4-2-7-5-9Z"/></svg>
      Fresh Ingredients
    </span>
    <span class="value-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 8.6c0 5.4-8.8 10.4-8.8 10.4S3.2 14 3.2 8.6a4.6 4.6 0 0 1 8.8-1.9 4.6 4.6 0 0 1 8.8 1.9Z"/></svg>
      Made with Love
    </span>
    <span class="value-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15a5 5 0 0 0 5-5V4H7v6a5 5 0 0 0 5 5Z"/><path d="M8 21h8M12 15v6"/></svg>
      Best Quality
    </span>
  </div>
</footer>

<script src="js/products-data.js"></script>
