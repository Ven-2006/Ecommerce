<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Product — Emybakeditph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo"><img src="images/logo.png" alt="Emybakeditph"></a>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="products.html" class="active">Products</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
      <a href="cart.html" class="cart-link" aria-label="View cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.6 13.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span class="cart-badge" data-cart-count>0</span>
      </a>
      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<div class="breadcrumb">
  <div class="container">
    <a href="index.html">Home</a><span class="sep">/</span>
    <a href="products.html">Products</a><span class="sep">/</span>
    <span id="breadcrumbName">Product</span>
  </div>
</div>

<main>
  <section class="section" id="productSection">
    <div class="container pd-layout">
      <div class="pd-figure">
        <img id="pdImage" src="" alt="">
      </div>
      <div>
        <h1 class="pd-name" id="pdName"></h1>
        <div class="pd-price" id="pdPrice"></div>
        <p class="pd-desc" id="pdDesc"></p>

        <div class="pd-qty-row">
          <span class="pd-meta-label">Quantity</span>
          <div class="qty-control">
            <button type="button" id="qtyMinus" aria-label="Decrease quantity">−</button>
            <input type="number" id="qtyInput" value="1" min="1" inputmode="numeric">
            <button type="button" id="qtyPlus" aria-label="Increase quantity">+</button>
          </div>
        </div>

        <div class="pd-buttons">
          <button type="button" class="btn btn-primary btn-block" id="addToCartBtn">Add to Cart</button>
          <a href="products.html" class="link-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
            Continue Shopping
          </a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="value-strip">
  <div class="container">
    <span class="value-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2v6M12 2c-3 2-5 5-5 9a5 5 0 0 0 10 0c0-4-2-7-5-9Z"/></svg>
      Fresh Ingredients
    </span>
    <span class="value-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 8.6c0 5.4-8.8 10.4-8.8 10.4S3.2 14 3.2 8.6a4.6 4.6 0 0 1 8.8-1.9 4.6 4.6 0 0 1 8.8 1.9Z"/></svg>
      Made with Love
    </span>
    <span class="value-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15a5 5 0 0 0 5-5V4H7v6a5 5 0 0 0 5 5Z"/><path d="M8 21h8M12 15v6"/></svg>
      Best Quality
    </span>
  </div>
</footer>

<script src="js/products-data.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script src="js/product-detail.js"></script>
</body>
</html>
